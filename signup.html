
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Ubuntu Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
    <script>
         

        function registerUser() {

             
            let email =
                document.getElementById("email").value;
            let password =
                document.getElementById("password").value;

              
               const user=  
                {username:email,
                 userpassword:password};// single users


              const users=JSON.parse(localStorage.getItem("registeruser")) || [];//read from local storage if data is there parse if null give blank 
              users.push(user);//pushing row to array
              localStorage.setItem("registeruser",JSON.stringify(users));// sending array to local storage
               
              alert('register successfully');
        }

    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Ubuntu", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background-color: grey;
        }

        /* Main container */

        .container {
            position: relative;

            width: 850px;
            height: 550px;

            background: white;

            border-radius: 30px;

            box-shadow: 0 0 30px rgba(0, 0, 0, .3);

            overflow: hidden;
        }

        /* Form area */

        .form-box {
            position: absolute;

            width: 50%;
            height: 100%;

            background: white;

            right: 0;

            display: flex;
            align-items: center;

            color: #333;

            text-align: center;

            padding: 40px;

            z-index: 1;
        }

        form {
            width: 100%;
        }

        /* Heading */

        .container h1 {
            font-size: 36px;
            margin: -10px 0 10px;
        }

        /* Input */

        .input-box {
            position: relative;

            margin: 20px 0;
        }

        .input-box input {
            width: 100%;

            padding: 13px;

            background: #dbd7d7;

            border-radius: 8px;

            border: none;

            outline: none;

            font-size: 16px;

            color: #333;

            font-weight: 500;
        }

        .input-box input::placeholder {
            font-weight: 400;
            color: #888;
        }

        /* Input icon */

        .input-box i {
            position: absolute;

            top: 50%;
            right: 20px;

            font-size: 20px;

            transform: translateY(-50%);

            color: #555;
        }

        /* Button */

        button {
            width: 100%;

            height: 48px;

            background: #7494ec;

            border-radius: 8px;

            box-shadow: 0 0 10px rgba(0, 0, 0, .1);

            border: none;

            cursor: pointer;

            font-weight: 600;

            font-size: 16px;

            color: white;

            transition: .3s;
        }

        button:hover {
            background: #5f7fe0;
        }

        /* Paragraph */

        .container p {
            font-size: 14.5px;

            margin: 15px 0;
        }

        /* Social icons */

        .social-icon {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-icon a {
            display: inline-flex;

            justify-content: center;
            align-items: center;

            width: 45px;
            height: 45px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 20px;

            color: #333;

            text-decoration: none;

            transition: .3s;
        }

        .social-icon a:hover {
            background: #7494ec;
            color: white;
            border-color: #7494ec;
        }

        /* Left green panel */

        .toggle-box {
            position: absolute;

            height: 100%;
            width: 100%;
        }

        .toggle-panel {
            position: absolute;

            width: 50%;
            height: 100%;

            background: seagreen;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            color: white;
        }

        .toggle-panel h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .toggle-panel p {
            margin-bottom: 20px;
        }

        .toggle-panel button {
            width: 160px;

            background: transparent;

            border: 2px solid white;

            box-shadow: none;
        }

        .toggle-panel button:hover {
            background: white;
            color: seagreen;
        }

        /* Mobile */

        @media (max-width: 900px) {

            .container {
                width: 90%;
            }

        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                height: auto;
                min-height: 550px;
            }

            .form-box {
                width: 100%;
                position: relative;
                padding: 30px;
            }

            .toggle-box {
                display: none;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Registration Form -->

        <div class="form-box Registration">

            <form action="">

                <h1>Registration</h1>


                <!-- Username -->

                <div class="input-box">

                    <input
                        type="text"
                        placeholder="Username"
                        id="name"
                        required
                    >

                    <i class="fa-solid fa-user"></i>

                </div>


                <!-- Email -->

                <div class="input-box">

                    <input
                        type="email"
                        placeholder="Email"
                        id="email"
                        required
                    >

                    <i class="fa-solid fa-envelope"></i>

                </div>


                <!-- Phone -->

                <div class="input-box">

                    <input
                        type="tel"
                        placeholder="phone number"
                        id="mobile"
                        maxlength="10"
                        required
                    >

                    <i class="fa-solid fa-phone"></i>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <input
                        type="password"
                        placeholder="Password"
                        id="password"
                        required
                    >

                    <i class="fa-solid fa-lock"></i>

                </div>


                <!-- Register Button -->

                <button
                    type="button"
                    class="btn"
                    onclick="registerUser()"
                >
                    Register
                </button>


                <!-- Social Login -->

                <p>
                    or  Register with social platform
                </p>


                <div class="social-icon">

                    <a href="#">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                </div>

            </form>

        </div>


        <!-- Green Panel -->

        <div class="toggle-box">

            <div class="toggle-panel">

                <h1>Hello, Welcome!</h1>

                <p>
                    Already have an account?
                </p>

                <button type="button">
                    Login
                </button>

            </div>

        </div>

    </div>

</body>

</html>
