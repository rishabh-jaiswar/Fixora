
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>

        /* Login function */
        function login(e) {

            e.preventDefault();

            let data = [
                {
                    username: "ris@123",
                    userpassword: "123"
                },

                {
                    username: "om@123",
                    userpassword: "12389"
                },

                {
                    username: "raj@123",
                    userpassword: "12356"
                }
            ];


            let username =
                document.getElementById("loginUsername").value;

            let password =
                document.getElementById("loginPassword").value;


            let result = data.find(function(user) {

                return user.username === username &&
                       user.userpassword === password;

            });


            if (result) {

                alert("Login successful!");

            } else {

                alert("Login failed! Invalid username or password.");

            }

        }

    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Ubuntu", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: grey;
        }

        /* Main container */
        .container {
            position: relative;
            width: 850px;
            height: 550px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Login form */
        .form-box {
            position: absolute;
            width: 50%;
            height: 100%;
            background: white;
            right: 0;

            display: flex;
            align-items: center;

            color: #333;
            text-align: center;

            padding: 40px;
            z-index: 1;
        }

        form {
            width: 100%;
        }

        .container h1 {
            font-size: 36px;
            margin: -10px 0 10px;
        }

        /* Input container */
        .input-box {
            position: relative;
            width: 100%;
            margin: 30px 0;
        }

        /* Input */
        .input-box input {
            width: 100%;
            height: 50px;

            padding: 13px 50px 13px 15px;

            background: #dbd7d7;
            border: none;
            outline: none;
            border-radius: 8px;

            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .input-box input::placeholder {
            font-weight: 400;
            color: #888;
        }

        /* Icons */
        .input-box i {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;
            color: #555;

            pointer-events: none;
        }

        /* Password eye icon */
        .input-box .eye-icon {
            pointer-events: auto;
            cursor: pointer;
            right: 15px;
        }

        /* Forgot password */
        .forget {
            margin: 17px 0;
            text-align: right;
        }

        .forget a {
            font-size: 14.5px;
            color: #333;
            text-decoration: none;
        }

        .forget a:hover {
            text-decoration: underline;
        }

        /* Login button */
        .btn {
            width: 100%;
            height: 48px;

            background: #7494ec;

            border-radius: 8px;
            border: none;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            cursor: pointer;

            font-weight: 600;
            font-size: 16px;
            color: white;

            transition: 0.3s;
        }

        .btn:hover {
            background: #5f7fe0;
        }

        /* Social text */
        .container p {
            font-size: 14.5px;
            margin: 15px 0;
        }

        /* Social icons */
        .social-icon {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-icon a {
            display: inline-flex;

            justify-content: center;
            align-items: center;

            width: 45px;
            height: 45px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 20px;
            color: #333;

            text-decoration: none;

            transition: 0.3s;
        }

        .social-icon a:hover {
            background: #7494ec;
            color: white;
            border-color: #7494ec;
        }

        /* Green side panel */
        .toggle-box {
            position: absolute;
            height: 100%;
            width: 100%;
        }

        .toggle-panel {
            position: absolute;

            width: 50%;
            height: 100%;

            background: seagreen;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            color: white;
        }

        .toggle-panel h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .toggle-panel p {
            margin-bottom: 20px;
        }

        /* Register button */
        .toggle-panel button {
            width: 160px;
            height: 48px;

            background: transparent;

            border: 2px solid white;
            border-radius: 8px;

            box-shadow: none;

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .toggle-panel button:hover {
            background: white;
            color: seagreen;
        }

        /* Tablet */
        @media (max-width: 900px) {

            .container {
                width: 90%;
            }

        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                width: 95%;
                height: auto;
                min-height: 550px;
            }

            .form-box {
                width: 100%;
                position: relative;
                padding: 30px;
            }

            .toggle-box {
                display: none;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGIN FORM -->
        <div class="form-box">

            <form >

                <h1>Login</h1>

                <!-- Username -->
                <div class="input-box">

                    <input
                        type="text"
                        placeholder="Username"
                        id="loginUsername"
                        required>

                    <i class="fa-solid fa-user"></i>

                </div>


                <!-- Password -->
                <div class="input-box">

                    <input
                        type="password"
                        placeholder="Password"
                        id="loginPassword"
                        required>

                    <i
                        class="fa-solid fa-eye eye-icon"
                        id="eyeIcon"
                        >
                    </i>

                </div>


                <!-- Forgot Password -->
                <div class="forget">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn"
                     onclick="login(event)">
                    Login

                </button>


                <!-- Social Login -->
                <p>
                    or Login with social platform
                </p>


                <div class="social-icon">

                    <a href="#">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                </div>

            </form>

        </div>


        <!-- GREEN PANEL -->
        <div class="toggle-box">

            <div class="toggle-panel">

                <h1>
                    Hello, Welcome!
                </h1>

                <p>
                    Don't have an account?
                </p>

                <button
                    type="button"
                    onclick="goToRegister()">

                    Register

                </button>

            </div>

        </div>

    </div>


    

</body>

</html>
